name: Site

on:
  push:
    branches: [master]
    paths:
      - site/**
      - desktop/src/assets/fonts/**
      - desktop/src/assets/brand/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The page uses the app's own fonts, mark, flask and flask emotes, so they are copied in here and not kept twice in the repo.
      - name: Put the site together
        run: |
          mkdir -p _site/fonts
          cp -r site/. _site/
          cp desktop/src/assets/fonts/* _site/fonts/
          cp desktop/src/assets/brand/mark.svg _site/assets/mark.svg
          cp desktop/src/assets/brand/flask-*.svg _site/assets/
          # The currency that falls into the first-map flask: a few of the app's own icons for both games.
          mkdir -p _site/assets/currency/poe1 _site/assets/currency/poe2
          for icon in chaos divine exalted mirror alchemy regal; do cp desktop/src/assets/currency/poe1/$icon.png _site/assets/currency/poe1/; done
          for icon in chaos.png divine.webp exalted.png mirror.png regal.png transmute.png; do cp desktop/src/assets/currency/poe2/$icon _site/assets/currency/poe2/; done
          cp -r desktop/src/assets/brand/reactions _site/assets/reactions
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
