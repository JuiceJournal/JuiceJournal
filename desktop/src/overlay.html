<!DOCTYPE html>
<html lang="en" data-overlay-visibility="waiting">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';">
  <title>Juice Journal Overlay</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="tokens.css">
  <style>
    /* Overlay card (Ember Forge): an opaque forged plate, so it stays readable over any game scene.
       No backdrop-filter or ambient animation; text is 11px or larger and click targets are 28px or larger. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; corner-shape: var(--corner-shape); }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.35;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 8px;
    }

    /* ── Card shell: frame with tone-coloured corner brackets around an opaque plate ── */
    .jj-card {
      --tone: var(--ember-hot);
      position: relative;
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: var(--bevel-lg);
      background: linear-gradient(180deg, rgb(var(--plate-rgb) / 0.97), rgb(var(--obsidian-rgb) / 0.97));
    }

    .jj-card::before {
      --reach: calc(var(--bevel-lg) + var(--bracket));
      content: "";
      position: absolute;
      inset: -1px;
      pointer-events: none;
      border: 1px solid var(--tone);
      border-radius: inherit;
      mask:
        linear-gradient(rgb(var(--shadow-rgb)) 0 0) top left / var(--reach) var(--reach) no-repeat,
        linear-gradient(rgb(var(--shadow-rgb)) 0 0) top right / var(--reach) var(--reach) no-repeat,
        linear-gradient(rgb(var(--shadow-rgb)) 0 0) bottom left / var(--reach) var(--reach) no-repeat,
        linear-gradient(rgb(var(--shadow-rgb)) 0 0) bottom right / var(--reach) var(--reach) no-repeat;
    }

    .jj-content {
      display: grid;
      gap: 4px;
      padding: 9px 13px 10px;
    }

    /* ── States and tones ── */
    [data-overlay-state="hidden"] { display: none; }
    [data-overlay-state="waiting"] { --tone: var(--smoke); }

    [data-overlay-mode="map-result"][data-overlay-tone="positive"] { --tone: var(--gain); }
    [data-overlay-mode="map-result"][data-overlay-tone="negative"] { --tone: var(--loss); }
    [data-overlay-mode="map-result"][data-profit-tier="loss"] { --tone: var(--loss); }
    [data-overlay-mode="map-result"][data-profit-tier="normal"] { --tone: var(--tier-normal); }
    [data-overlay-mode="map-result"][data-profit-tier="magic"] { --tone: var(--tier-magic); }
    [data-overlay-mode="map-result"][data-profit-tier="rare"] { --tone: var(--tier-rare); }
    [data-overlay-mode="map-result"][data-profit-tier="unique"] { --tone: var(--tier-unique); }
    [data-overlay-mode="map-result"][data-profit-tier="mirror"] { --tone: var(--tier-mirror); }

    [data-overlay-mode="start-map-prompt"],
    [data-overlay-mode="character-prompt"] { --tone: var(--brass); }

    /* ── Short enter/exit for the result card: transform and opacity only ── */
    [data-overlay-mode="map-result"][data-overlay-state="visible"] {
      animation: jj-slide-in var(--duration-enter) var(--ease-out) both;
    }

    [data-overlay-exiting="true"] {
      animation: jj-slide-out var(--duration-fast) ease-in both;
    }

    @keyframes jj-slide-in {
      from { opacity: 0; transform: translateX(24px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes jj-slide-out {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(24px); }
    }

    @media (prefers-reduced-motion: reduce) {
      [data-overlay-mode="map-result"][data-overlay-state="visible"],
      [data-overlay-exiting="true"] { animation: none; }
    }

    /* ── Header row ── */
    .jj-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 18px;
    }

    .jj-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--tone);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .jj-label::before {
      content: "";
      width: 7px;
      height: 7px;
      background: currentColor;
      transform: rotate(45deg);
    }

    .jj-actions {
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }

    .jj-btn,
    .jj-form-btn,
    .jj-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      border: none;
      border-radius: var(--bevel-sm);
      background: var(--plate-raised);
      box-shadow: inset 0 0 0 1px var(--line-strong);
      color: var(--text);
      cursor: pointer;
      pointer-events: auto;
      font-family: var(--font);
      white-space: nowrap;
      transition: background-color var(--duration-fast), box-shadow var(--duration-fast);
    }

    .jj-btn {
      padding: 0 10px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .jj-btn:hover,
    .jj-form-btn:hover,
    .jj-chip:hover {
      box-shadow: inset 0 0 0 1px var(--gold-dim);
    }

    .jj-btn[aria-pressed="true"] {
      color: var(--text-bright);
      background: rgb(var(--brass-rgb) / 0.22);
      box-shadow: inset 0 0 0 1px var(--brass);
    }

    .jj-btn-dismiss:hover {
      box-shadow: inset 0 0 0 1px var(--loss);
    }

    .jj-btn[hidden] { display: none; }

    /* ── Primary line: name in the display face, value in tabular figures ── */
    .jj-primary {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
      color: var(--text-bright);
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
    }

    .jj-primary-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .jj-value {
      flex-shrink: 0;
      color: var(--tone);
      font-family: var(--font);
      font-size: 20px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    /* ── Secondary row ── */
    .jj-secondary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--text-secondary);
      font-size: 12.5px;
    }

    .jj-secondary {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .jj-secondary img {
      width: 18px;
      height: 18px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .jj-meta {
      flex-shrink: 0;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    /* ── Prompt forms (mouse only: the overlay never takes focus) ── */
    .jj-form {
      display: grid;
      gap: 8px;
      margin-top: 4px;
      pointer-events: auto;
    }

    .jj-form[hidden] { display: none; }

    .jj-field {
      display: grid;
      gap: 6px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .jj-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 96px;
      overflow-y: auto;
    }

    .jj-chip {
      padding: 0 11px;
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.01em;
      text-transform: none;
    }

    .jj-chip[aria-pressed="true"] {
      color: var(--text-bright);
      background: rgb(var(--ember-rgb) / 0.2);
      box-shadow: inset 0 0 0 1px var(--ember-hot);
    }

    /* A check mark drawn with borders, so selection is not shown by colour alone. */
    .jj-chip[aria-pressed="true"]::before {
      content: "";
      flex-shrink: 0;
      width: 4px;
      height: 8px;
      margin: -2px 7px 0 1px;
      border: solid currentColor;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    /* ── Farm types: each league's content colour on its name ── */
    [data-farm-type="abyss"] { --farm-color: var(--farm-abyss); }
    [data-farm-type="breach"] { --farm-color: var(--farm-breach); }
    [data-farm-type="expedition"] { --farm-color: var(--farm-expedition); }
    [data-farm-type="ritual"] { --farm-color: var(--farm-ritual); }
    [data-farm-type="harbinger"] { --farm-color: var(--farm-harbinger); }
    [data-farm-type="essence"] { --farm-color: var(--farm-essence); }
    [data-farm-type="delirium"] { --farm-color: var(--farm-delirium); }
    [data-farm-type="blight"] { --farm-color: var(--farm-blight); }
    [data-farm-type="legion"] { --farm-color: var(--farm-legion); }
    [data-farm-type="harvest"] { --farm-color: var(--farm-harvest); }
    [data-farm-type="betrayal"] { --farm-color: var(--farm-betrayal); }
    [data-farm-type="incursion"] { --farm-color: var(--farm-incursion); }

    .jj-primary-name[data-farm-type],
    .jj-chip[data-farm-type] { color: var(--farm-color); }

    /* The farm colour keeps 5.1:1 or more on the raised plate; on the ember tint it drops below 4.5:1. */
    .jj-chip[data-farm-type][aria-pressed="true"] {
      background: var(--plate-raised);
      box-shadow: inset 0 0 0 2px var(--farm-color);
    }

    .jj-form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .jj-form-btn {
      min-height: 32px;
      padding: 0 14px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .jj-form-btn.primary {
      background: linear-gradient(180deg, var(--ember-hot), var(--ember-deep));
      box-shadow: none;
      color: var(--on-accent);
    }

    .jj-form-btn.primary:hover {
      filter: brightness(1.08);
    }

    .jj-form-btn:disabled {
      cursor: wait;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <main class="jj-card" data-overlay-state="waiting" data-overlay-mode="runtime" data-overlay-tone="neutral" aria-live="polite">
    <section class="jj-content">
      <div class="jj-header">
        <span class="jj-label" data-overlay-kicker-label>Juice Journal</span>
        <div class="jj-actions">
          <button class="jj-btn" type="button" data-overlay-pin aria-pressed="false" hidden>Pin</button>
          <button class="jj-btn jj-btn-dismiss" type="button" data-overlay-dismiss hidden>Dismiss</button>
        </div>
      </div>
      <div class="jj-primary" data-overlay-primary>Waiting for game</div>
      <div class="jj-secondary-row">
        <span class="jj-secondary" data-overlay-secondary>Waiting for runtime session</span>
        <span class="jj-meta" data-overlay-meta aria-live="off"></span>
      </div>
      <form class="jj-form" data-overlay-start-form hidden>
        <div class="jj-field">
          <span>Farm Type</span>
          <div class="jj-chips" role="group" aria-label="Farm type" data-overlay-start-farm-types></div>
        </div>
        <div class="jj-form-actions">
          <button class="jj-form-btn" type="button" data-overlay-start-cancel>Cancel</button>
          <button class="jj-form-btn primary" type="submit" data-overlay-start-submit>Start Map</button>
        </div>
      </form>
      <div class="jj-form" data-overlay-character-form hidden>
        <div class="jj-field">
          <span>Switch character</span>
          <div class="jj-chips" role="group" aria-label="Character" data-overlay-characters></div>
        </div>
        <div class="jj-form-actions">
          <button class="jj-form-btn primary" type="button" data-overlay-character-keep>Keep</button>
        </div>
      </div>
    </section>
  </main>
  <script src="modules/overlayStateModel.js"></script>
  <script src="modules/profitCurrencyModel.js"></script>
  <script src="modules/profitTierModel.js"></script>
  <script src="modules/farmTypeModel.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
